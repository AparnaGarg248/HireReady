<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration — HireReady AI</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="brand-logo">
          <i class="fa-solid fa-graduation-cap"></i>
          <span>HireReady <span style="color: var(--accent-sky)">AI</span></span>
        </a>

        <div class="nav-auth">
          <a href="login.html" class="btn btn-outline btn-sm">Already have an account? Login</a>
        </div>
      </div>
    </nav>

    <!-- Registration Main Container -->
    <main class="auth-wrapper">
      <div class="auth-card" style="max-width: 520px">
        <div class="auth-header">
          <div class="auth-logo">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h1 class="auth-title">Create Student Account</h1>
          <p class="auth-subtitle">Register to begin your placement aptitude and resume evaluation</p>
        </div>

        <form id="register-form" class="auth-form">
          <div class="form-group">
            <label for="name" class="form-label">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              class="form-input"
              placeholder="Enter your name..."
              required
              autocomplete="name"
            />
          </div>

          <div class="form-group">
            <label for="email" class="form-label">College Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="e.g. student@chitkarauniversity.edu.in"
              required
              autocomplete="email"
            />
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
            <div class="form-group">
              <label for="college" class="form-label">Institution / University</label>
              <input
                type="text"
                id="college"
                name="college"
                class="form-input"
                value="Chitkara University"
              />
            </div>

            <div class="form-group">
              <label for="branch" class="form-label">Branch / Department</label>
              <input
                type="text"
                id="branch"
                name="branch"
                class="form-input"
                value="Computer Science & Engg"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password (Min. 6 characters)</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter password..."
              minlength="6"
              required
              autocomplete="new-password"
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="form-input"
              placeholder="Re-Enter password..."
              minlength="6"
              required
              autocomplete="new-password"
            />
          </div>

          <button
            type="submit"
            id="register-submit-btn"
            class="btn btn-primary"
            style="width: 100%; margin-top: 8px"
          >
            Register & Enter Dashboard
          </button>
        </form>

        <div class="auth-footer">
          Already registered? <a href="login.html">Sign in here</a>
        </div>
      </div>
    </main>

    <footer class="footer" style="padding: 24px 0">
      <div class="container" style="text-align: center; font-size: 0.85rem">
        © 2026 HireReady AI • Placement Readiness and Career Analytics Platform
      </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
